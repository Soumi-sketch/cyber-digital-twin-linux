<!DOCTYPE html>
<html>

<head>

    <title>Cyber Digital Twin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>AI Powered Cyber Digital Twin</h1>

    <div id="dashboard">

        <div class="card">

            <h2>Hostname</h2>

            <p id="hostname">Loading...</p>

        </div>

        <div class="card">

            <h2>Status</h2>

            <p id="status">Loading...</p>

        </div>

        <div class="card">

            <h2>CPU Usage</h2>

            <p id="cpu">Loading...</p>

        </div>

        <div class="card">

            <h2>Memory Usage</h2>

            <p id="memory">Loading...</p>

        </div>

        <div class="card">

            <h2>Disk Usage</h2>

            <p id="disk">Loading...</p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
